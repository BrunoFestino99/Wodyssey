services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wodyssey
      POSTGRES_USER: wodyssey
      POSTGRES_PASSWORD: wodyssey
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wodyssey -d wodyssey"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - wodyssey-postgres:/var/lib/postgresql/data

volumes:
  wodyssey-postgres:
