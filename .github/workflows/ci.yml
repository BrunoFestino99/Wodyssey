name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # First, so Docker Compose starts from nothing, as on a fresh clone.
      - run: npm run test:dev-smoke:compose
      - run: npm run dev:db
      - run: npm run check
      - run: npm run test:dev-smoke
      - run: npm run test:images
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
